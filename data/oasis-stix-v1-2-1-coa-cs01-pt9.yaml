abstract:
- language: en
  script: Latn
  content: The Structured Threat Information Expression (STIX) framework defines nine
    core constructs and the relationships between them for the purposes of modeling
    cyber threat information and enabling cyber threat information analysis and sharing.
     This specification document defines the Course of Action construct, which conveys
    specific measures to be taken to address threats whether they are corrective or
    preventative to address Exploit Targets, or responsive to counter or mitigate
    the potential impacts of Incidents.
