abstract:
- language: en
  script: Latn
  content: The Structured Threat Information Expression (STIX) framework defines nine
    core constructs and the relationships between them for the purposes of modeling
    cyber threat information and enabling cyber threat information analysis and sharing. 
    This specification document defines the Data Marking data model, which provides
    an independent, flexible, structured capability for data marking expression.
