- language: en
  script: Latn
  content: Describing a profile of Computer Graphics Metafile (CGM), ISO/IEC 8632:1999.
    WebCGM adds Web linking and is optimized for Web applications in technical illustration,
    electronic documentation, geophysical data visualization, and similar fields.
    It represents a significant interoperability agreement amongst major users and
    implementers of the ISO CGM standard.
