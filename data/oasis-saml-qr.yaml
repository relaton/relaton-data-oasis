abstract:
- language: en
  script: Latn
  content: Defines an extension to the SAML V2.0 metadata specification [SAML2Meta].
    The extension defines role descriptor types that describe a standalone SAML V1.x
    or V2.0 query requester for each of the three predefined query types. Readers
    are advised to familiarize themselves with that specification before reading this
    one.
