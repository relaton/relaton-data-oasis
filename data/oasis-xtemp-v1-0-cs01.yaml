abstract:
- language: en
  script: Latn
  content: XTemp is an XML mark-up language that is event-centric and intended for
    the analysis of a sequence of events that represent traces of business processes.
    It is designed for both log analysis and real-time execution. It leverages XPath
    and XSLT.
