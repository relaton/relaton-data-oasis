abstract:
- language: en
  script: Latn
  content: Extends RuleML with formal features specific to legal norms, guidelines,
    policies and reasoning. It defines a specification (expressed with XML-schema
    and Relax NG) that is able to represent the particularities of the legal normative
    rules with a rich, articulated, and meaningful markup language.
